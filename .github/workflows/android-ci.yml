name: Android CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Unit tests & debug build
    runs-on: ubuntu-latest
    outputs:
      version_code: ${{ steps.version.outputs.code }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Restore private stable debug keystore when configured
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            printf '%s' "$DEBUG_KEYSTORE_BASE64" | base64 --decode > debug.keystore
            chmod 600 debug.keystore
            echo "Stable debug signing identity restored from Actions secrets."
          else
            echo "No stable debug keystore secret available; verification will use the runner-local debug identity."
            echo "Rolling release publication will remain disabled."
          fi

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Set monotonic build version
        id: version
        run: |
          CODE=$(( $(date +%s) / 60 ))
          echo "BUILD_NUMBER=$CODE" >> "$GITHUB_ENV"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"

      - name: Run unit tests
        env:
          DEBUG_KEYSTORE_PASSWORD: ${{ secrets.DEBUG_KEYSTORE_PASSWORD }}
          DEBUG_KEY_ALIAS: ${{ secrets.DEBUG_KEY_ALIAS }}
          DEBUG_KEY_PASSWORD: ${{ secrets.DEBUG_KEY_PASSWORD }}
        run: ./gradlew testDebugUnitTest lintDebug --stacktrace

      - name: Assemble debug APK
        env:
          DEBUG_KEYSTORE_PASSWORD: ${{ secrets.DEBUG_KEYSTORE_PASSWORD }}
          DEBUG_KEY_ALIAS: ${{ secrets.DEBUG_KEY_ALIAS }}
          DEBUG_KEY_PASSWORD: ${{ secrets.DEBUG_KEY_PASSWORD }}
          # Deliberately do NOT inject BACKEND_TOKEN into a public APK. A static
          # token compiled into an Android application is extractable and cannot
          # protect a billable backend as a true secret. Public builds use the
          # app's keyless/free fallback unless a safer auth design is added.
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload verification APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore

  publish-latest:
    name: Rolling release gate
    needs: [build, device-smoke]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check whether private stable signing is configured
        id: signing
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "Private stable signing is configured; rolling publication may proceed."
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Rolling publication skipped: configure a NEW DEBUG_KEYSTORE_BASE64 secret first."
            echo "Do not reuse the debug key that previously existed in public Git history."
          fi

      - name: Checkout
        if: steps.signing.outputs.configured == 'true'
        uses: actions/checkout@v4

      - name: Download signed debug APK
        if: steps.signing.outputs.configured == 'true'
        uses: actions/download-artifact@v4
        with:
          name: app-debug

      - name: Generate version.json for in-app update check
        if: steps.signing.outputs.configured == 'true'
        env:
          BUILD_NUMBER: ${{ needs.build.outputs.version_code }}
        run: |
          APK_NAME="$(basename "$(ls *.apk | head -n1)")"
          VERSION_NAME="$(grep -oE 'versionName = "[^"]+"' app/build.gradle.kts | head -n1 | sed -E 's/versionName = "([^"]+)"/\1/')"
          VERSION_NAME="${VERSION_NAME:-unknown}"
          cat > version.json <<EOF
          {
            "versionCode": ${BUILD_NUMBER},
            "versionName": "${VERSION_NAME}",
            "notes": "Rolling development release from ${GITHUB_SHA::7} (run #${BUILD_NUMBER}).",
            "apkUrl": "https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/${APK_NAME}"
          }
          EOF

      - name: Create or refresh latest release
        if: steps.signing.outputs.configured == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view latest -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create latest -R "$GITHUB_REPOSITORY" \
              --title "Latest field build" \
              --notes "Rolling development release from main."
          gh release upload latest *.apk version.json -R "$GITHUB_REPOSITORY" --clobber
          gh release edit latest -R "$GITHUB_REPOSITORY" \
            --notes "Rolling development release from ${GITHUB_SHA::7} (run #${{ github.run_number }})."

  device-smoke:
    name: Android device smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            ./gradlew connectedDebugAndroidTest --stacktrace
            adb pull /sdcard/Android/data/com.aistudio.myceliummapper.vcfqka/files/screenshots device-screenshots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: device-evidence
          path: |
            device-screenshots/
            app/build/reports/androidTests/
