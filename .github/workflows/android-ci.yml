name: Android CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: App, backend and website checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      # Current Ubuntu runners already have cmdline-tools/latest. The v3 action
      # attempts to install the removed legacy SDK package "tools" and fails
      # before it reaches Gradle; use supported package names instead.
      - name: Install current Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          : "${ANDROID_HOME:?Android SDK missing}"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check backend and website
        run: |
          python -m pip install -r backend/requirements-test.txt
          python -m unittest discover -s backend -v
          python -m unittest discover -s scripts -p 'test_*.py' -v
          node scripts/sync_catalogue.cjs --check
          node --check docs/app.js
          node --check docs/release.js
          node --test tests/site.test.cjs
      - name: Test and build Android
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest lintDebug assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug-verification-only
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results*
          if-no-files-found: ignore

  device-smoke:
    name: Android device smoke test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      # Current Ubuntu runners already have cmdline-tools/latest. The v3 action
      # attempts to install the removed legacy SDK package "tools" and fails
      # before it reaches Gradle; use supported package names instead.
      - name: Install current Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          : "${ANDROID_HOME:?Android SDK missing}"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            chmod +x gradlew
            ./gradlew connectedDebugAndroidTest --stacktrace
            adb pull /sdcard/Android/data/com.aistudio.myceliummapper.vcfqka/files/screenshots device-screenshots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: device-evidence
          path: |
            device-screenshots/
            app/build/reports/androidTests/
          if-no-files-found: warn

  publish-latest:
    name: Verify and publish signed release
    needs: [build, device-smoke]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
      STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
      KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
      KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
    steps:
      - name: Require private production signing
        run: |
          for name in RELEASE_KEYSTORE_BASE64 STORE_PASSWORD KEY_PASSWORD KEY_ALIAS; do
            if [ -z "${!name}" ]; then
              echo "::error::Publication blocked: configure a new private release signing identity ($name is missing)."
              echo "No APK was published. Do not reuse the key exposed in public Git history." >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
          done
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      # Current Ubuntu runners already have cmdline-tools/latest. The v3 action
      # attempts to install the removed legacy SDK package "tools" and fails
      # before it reaches Gradle; use supported package names instead.
      - name: Install current Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          : "${ANDROID_HOME:?Android SDK missing}"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and verify production APK
        run: |
          KEYSTORE_PATH="$RUNNER_TEMP/myceliyum-release.jks"
          export KEYSTORE_PATH
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"
          trap 'rm -f "$KEYSTORE_PATH"' EXIT
          chmod +x gradlew
          ./gradlew testReleaseUnitTest lintRelease assembleRelease --stacktrace
          sdkmanager "build-tools;35.0.0"
          export PATH="$ANDROID_HOME/build-tools/35.0.0:$PATH"
          cp app/build/outputs/apk/release/app-release.apk .
          python scripts/release_manifest.py app-release.apk --commit "$GITHUB_SHA"
      - name: Publish verified release and matching metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view latest -R "$GITHUB_REPOSITORY" --json body > previous-release.json; then
            python scripts/check_release_progression.py previous-release.json version.json
          else
            gh release create latest -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Latest verified field build" --notes-file release-notes.md
          fi
          gh release upload latest app-release.apk version.json -R "$GITHUB_REPOSITORY" --clobber
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/latest" -f sha="$GITHUB_SHA" -F force=true
          gh release edit latest -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --notes-file release-notes.md
          echo "Published Android APK, version manifest, SHA-256 and source commit together." >> "$GITHUB_STEP_SUMMARY"
